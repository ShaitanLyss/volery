[package]
name = "skein"
version = "0.20.0"
description = "A studio wall for every Claude Code conversation at once"
authors = ["moonlyss"]
# Read at compile time by `update.rs`, which asks this repository's releases
# whether there is a newer tag. One place, and it is the place a rename is
# already editing.
repository = "https://github.com/ShaitanLyss/volery"
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "skein_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Not used by our own `build.rs` — this is here to *constrain* somebody else's.
#
# `librespot-core`'s build script wants `vergen ^9` and `vergen-gitcl ^1`. Those
# were one family until vergen 9.1.0 (2026-01-16) moved from `vergen-lib ^0.1.6`
# to `vergen-lib ^9.1.0` — a breaking change inside a *minor* bump, so `^9` picks
# it up. `vergen-gitcl 1.0.8` is still on 0.1.6, both land in one build script,
# and the two `Add` traits are not the same trait:
#
#   error[E0277]: the trait bound `vergen::feature::build::Build:
#                 vergen_lib::entries::Add` is not satisfied
#
# librespot 0.8.0 was published 2025-11-10 and built fine at the time; it was
# broken retroactively by a crate it does not name, which is what makes this
# worth eleven lines of comment.
#
# An `=` requirement in the manifest rather than a `Cargo.lock` pin, deliberately:
# a lock pin is undone by the next re-resolution (`cargo update`, or simply
# adding a dependency), and the error it comes back with mentions no Spotify
# crate at all. Declaring the constraint here is the only form of it that
# survives. Drop it when librespot's build-deps agree again.
vergen = "=9.0.6"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `bundled` compiles SQLite from source — no system dependency to install,
# which matters for a desktop app people just download and run.
rusqlite = { version = "0.32", features = ["bundled"] }
# The ask_user MCP endpoint. Blocking and tiny — the protocol we need is four
# JSON-RPC methods over POST, proven by probe before writing any of this.
tiny_http = "0.12"
# A real pseudo-terminal for dev servers. Piped stdout makes most tools drop
# their colour and their progress rendering; a PTY makes them behave as they
# would in your PowerShell. Same ConPTY under the hood that WezTerm uses.
tauri-plugin-dialog = "2"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
# Azure DevOps over HTTPS. Blocking and small, the same bargain `tiny_http` is:
# what we need is four GETs, and an async runtime to make them would be the
# larger dependency by far.
#
# `native-certs` rather than the default `tls` feature, and it is load-bearing
# rather than a preference. This network runs Netskope TLS interception —
# probed 2026-08-14, `dev.azure.com` presents a certificate issued by
# `ca.macquarietelecom-103950.au.goskope.com`, not by any public CA. rustls'
# default root set is webpki-roots, a bundled copy of Mozilla's, which cannot
# contain a corporate CA and would fail every request with a certificate error
# on the one network this app is used from. The Netskope root *is* in Windows'
# own LocalMachine\Root store (thumbprint 41B6D53D…), which is what
# `rustls-native-certs` reads. Pure Rust either way, so the no-MSVC mingw build
# is unaffected — a schannel-backed `native-tls` would work too and costs a C
# toolchain we go out of our way not to need.
ureq = { version = "2", default-features = false, features = ["tls", "native-certs", "json", "gzip"] }
# **Both root sets, merged in `forge::tls`** — and the merge is the load-bearing
# part, not either half. `native-certs` alone was the original answer and it is
# not enough: measured 2026-08-28, `load_native_certs()` returns *one* root on
# this machine out of forty-five in the store, because its Windows loader keeps
# only roots marked valid for server auth and policy here has EKU-restricted
# every built-in one. So the app trusted the interception CA and nothing else,
# which silently works for whatever Netskope decrypts and fails `UnknownIssuer`
# for whatever it passes through. `webpki-roots` puts the ordinary public set
# back; `native-certs` keeps the corporate CA. Neither is optional.
# The `log` facade, so `applog.rs` can install a sink for it. Every dependency
# in this graph already logs through it — librespot loudly and usefully — and
# until 2026-08-28 all of it went nowhere, which cost a day. See `applog.rs`.
# `std` is not on by default and `set_boxed_logger` lives behind it — the error
# without it says "not found in `log`" and names no feature, which is the usual
# shape of a missing one.
log = { version = "0.4", features = ["std"] }
webpki-roots = "0.26"
rustls-native-certs = "0.7"
# nvim own UI protocol, which is msgpack-RPC over three pipes — see `nvim.rs`.
# `rmpv` rather than a hand-rolled reader for one reason that matters: msgpack
# is self-delimiting, and `read_value` consumes exactly one message from a
# stream, so there is no framing here to get wrong. It also knows about *ext*
# types, which nvim uses for every buffer and window handle and which a naive
# decoder chokes on the moment one appears.
rmpv = "1"
# Being the player rather than driving one — see `.claude/rules/spotify.md`,
# which carries the whole argument including the terms-of-service position.
#
# Probed 2026-08-27 on the no-MSVC gnu toolchain: `cargo check` is clean in
# 1m36s and needs no protoc, no cmake and no C toolchain, because the decoders
# are `symphonia` (pure Rust) and `rodio` reaches WASAPI through the `windows`
# crate we already have.
#
# `default-features = false` on -playback keeps ALSA, PulseAudio, JACK, SDL and
# GStreamer out of a Windows build; rodio is the one backend that means anything
# here.
librespot-core = "0.8"
librespot-playback = { version = "0.8", default-features = false, features = ["rodio-backend"] }
librespot-metadata = "0.8"
librespot-oauth = "0.8"
librespot-connect = "0.8"
# NOTE FOR WHOEVER RUNS `cargo update`: this tree pins `vergen` to 9.0.6 in
# Cargo.lock and the pin is load-bearing. `librespot-core`'s build script wants
# `vergen ^9` and `vergen-gitcl ^1`; vergen 9.1.0 moved from `vergen-lib ^0.1.6`
# to `^9.1.0` — a breaking change inside a minor bump — and the two `Add` traits
# then unify into one build script and do not match. The error names no Spotify
# crate at all, which is what makes it worth this comment. Re-pin with
# `cargo update -p vergen --precise 9.0.6`.
# Two things, both about librespot. `time::timeout`, because
# `tauri::async_runtime` is a tokio runtime that re-exports no timer and the two
# calls into librespot that reach the network — `Session::connect` and
# `Spirc::new` — are both unbounded: librespot's own `connection::connect` wraps
# a 5s timeout around the *handshake* and constructs the TCP connect outside it,
# so every attempt costs the OS its full SYN timeout. Measured 2026-08-28: 253s
# to exhaust six access points. And `net`/`io-util`, for the loopback CONNECT
# tunnel in `tunnel.rs` that gets librespot onto an IPv4 address at all.
tokio = { version = "1", features = ["time", "net", "io-util"] }
# `SessionConfig::proxy` is an `Option<Url>` and librespot-core re-exports only
# six of its own types, so the one place this app builds a URL needs the crate
# directly. See `tunnel.rs` for why there is a proxy at all.
url = "2"

[target.'cfg(windows)'.dependencies]
# Job objects. A dev server is `npm run dev` spawning node spawning more node;
# killing the parent leaves orphans holding ports. A job object kills the tree.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    # CreateJobObjectW takes a SECURITY_ATTRIBUTES, which lives behind this.
    "Win32_Security",
    # The Azure DevOps token goes in the Windows credential vault rather than
    # into this app's own database — `vault.rs` has the argument. advapi32's
    # Cred* family lives behind this one.
    "Win32_Security_Credentials",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    # The control surface drives the *real* cursor. A synthetic pointer event
    # can't see Chromium retargeting a click after setPointerCapture, which is
    # the bug class that has shipped here twice.
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# Only `examples/pty-probe.rs` uses this, and deliberately: dev servers moved to
# pipes when every `openpty` child on this machine turned out to die at
# 0xC0000142, so the app itself no longer links a ConPTY path — no attribute
# list, no conpty.dll LoadLibrary probe, no conhost child. The probe stays
# because the *cause* is still unsettled (see .claude/rules/servers.md), and a
# dev-dependency is how it stays buildable without putting any of that back in
# the shipped binary.
portable-pty = "0.9"
