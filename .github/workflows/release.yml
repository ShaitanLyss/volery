# Builds Volery on a real MSVC runner, which is the toolchain the machine this is
# developed on does not have. Consequences worth knowing, all of them good:
#
#   - No `windres` shim and no gnu toolchain — see CLAUDE.md, "Building without MSVC".
#   - WebView2Loader links *statically* here (webview2-com-sys picks WebView2LoaderStatic
#     on target_env = "msvc"), so there is no loose DLL to ship and no `--config` overlay.
#   - `cargo test` runs. On gnu the harness exe dies at load with 0xC0000139 before any
#     test executes, so the Rust suites have never run on the dev machine at all.
#
# It deliberately does NOT build on every push. The repo is public, so GitHub-hosted
# minutes are free and this is not about cost — it is that commits here are frequent and
# small, and a release build per commit is noise: a run history where every entry is
# meaningful is worth more than one that logs every keystroke. (If volery ever goes private
# again the cost argument returns on top: Windows runners bill at 2x, and a cold build is
# ~405 crates.) Builds are batched three ways:
#
#   tag v*            an explicit release — you decide the batch boundary
#   schedule          at most one build a day, and only if something landed (see `gate`)
#   workflow_dispatch on demand, from the Actions tab
#
name: release

on:
  push:
    tags: ['v*']
  schedule:
    # 03:00 UTC. N commits in a day collapse into one build; a quiet day builds nothing.
    - cron: '0 3 * * *'
  workflow_dispatch:

# A re-tag or a second dispatch supersedes the run in flight rather than paying for both.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write        # needed only by the `release` step, to upload installers

jobs:
  # Decides whether the nightly is worth running at all. Not about minutes (they are free
  # on a public repo) but about the run history: a nightly that rebuilds an unchanged tree
  # every morning fills the Actions tab with entries that mean nothing, and a red run
  # among them stops being noticeable. Cheap to ask, so it is asked on Linux.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # `git log --since` needs real history

      - id: decide
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "a tag or a manual run is always deliberate — building"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "commits in the last 24h:"
            git log --since='24 hours ago' --oneline
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing landed in 24h — skipping the windows runner"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 60         # a hung build should fail, not sit there for six hours
    env:
      # Presence of this decides whether the signing step runs at all, so the workflow is
      # green today and signs the moment the secret exists. See the step for the caveat.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: bun install --frozen-lockfile

      # sherpa-onnx's shared runtime, for `voice.rs`. A step rather than leaving it
      # to the crate's own build-time download, for two reasons that are both about
      # this being a *bundled* dependency rather than only a linked one:
      #
      #   - `tauri.conf.json` names the two DLLs in `bundle.resources`, and tauri's
      #     build script validates those paths BEFORE cargo builds the crates that
      #     would produce them. A normal dependency's build script is not ordered
      #     ahead of its dependent's, so `target/release/...` is empty at that
      #     moment and the build dies naming a resource that does not exist. This
      #     is measured, not theoretical: it cost a full release build here.
      #   - It pins what gets shipped to one archive fetched in the open, rather
      #     than to whatever a build script downloads on its own.
      #
      # The same script provisions the dev machine, so CI and local are identical.
      - name: sherpa-onnx runtime
        shell: bash
        run: echo "SHERPA_ONNX_LIB_DIR=$(bash tools/fetch-sherpa.sh)" >> "$GITHUB_ENV"

      # svelte-check + tsc over src/**
      - name: check
        run: bun run check

      # The pure suites: ansi, classify, layout, specs, history, menu, markdown, actions,
      # outline, ambience, transcript, commands. Deliberately not `test:live` (spends real
      # API money) and not `test:wall` (drives a running app, which CI has not got).
      - name: pure suites
        run: bun run test

      # store.rs, ask.rs, control.rs, supervisor.rs, servers.rs, sessions.rs, project.rs.
      # First place these have ever run — expect to iterate on anything that assumed a
      # desktop session or a `claude` binary on PATH.
      - name: rust suites
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: build
        run: bun run tauri build

      # The `-setup.exe` below is what the in-app updater downloads and drives.
      # `update.ts::pickInstaller` takes the NSIS one and never the MSI, because
      # the NSIS installer is the one that parses `/P /UPDATE /R` out of its own
      # command line; so a release that publishes only the MSI is a release
      # nothing can update to, silently. Both go up, as they always have.

      # Inert until the certificate exists.
      #
      # Route decided 2026-08-17: SignPath Foundation, which is free for OSS and wants an
      # application. Azure Artifact Signing (the renamed Trusted Signing) is the other real
      # option — $9.99/mo, no approval queue, and it signs the inner exe in the same pass
      # via tauri.conf.json's bundle.windows.signCommand — but its identity validation
      # reaches US/Canada individuals and EU/UK organisations only, and this is an
      # Australian individual. Closed to us until that changes.
      #
      # Wiring it is not a matter of filling this step in, because SignPath signs an
      # artifact that has *already been uploaded*: it takes a `github-artifact-id`, submits
      # it, waits, and writes the signed files back down. So the order below has to invert —
      #
      #   artifacts   upload the unsigned bundle, keep its `outputs.artifact-id`
      #   sign        signpath/github-action-submit-signing-request@v2 with that id,
      #               wait-for-completion, output-artifact-directory: signed
      #   release     publish out of `signed/`, not out of target/release/bundle
      #
      # — and `release` needs to fall back to the unsigned paths when the token is absent,
      # or a tag pushed before approval stops producing a release at all.
      #
      # Ask them about nested signing when applying. SignPath's artifact configuration can
      # descend into an installer and sign the binaries inside it, which is what would get
      # Volery.exe signed too. Without that, the installers are signed and the exe inside
      # them is not — and the inner exe is the one an EDR watches at runtime, so it is the
      # one that matters here. The installer signature only buys SmartScreen on download.
      #
      # Neither buys anything against a behavioural detection. Signing buys reputation for
      # a hash that is otherwise brand new on every build; an app that spawns `claude` with
      # --dangerously-skip-permissions will still look interesting.
      - name: sign
        if: env.SIGNPATH_API_TOKEN != ''
        run: |
          echo "SIGNPATH_API_TOKEN is set but this step is still a no-op — see the comment"
          echo "above: the artifacts/sign/release order has to invert first. Still left"
          echo "green rather than failed, so the secret alone does not break the build."

      - name: artifacts
        uses: actions/upload-artifact@v7
        with:
          name: volery-windows-x64
          retention-days: 14
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe

      # Only a tag produces a Release. A nightly leaves artifacts and nothing else, or the
      # releases page would fill up with builds nobody asked for.
      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Volery ${GITHUB_REF_NAME}" \
            --generate-notes \
            src-tauri/target/release/bundle/msi/*.msi \
            src-tauri/target/release/bundle/nsis/*-setup.exe
